server {
    listen       80;
    server_name  localhost;

    root   /usr/share/nginx/html;
    index  index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # The dashboard calls the central API through this path rather than through
    # the API's published port. That keeps the browser on a single origin and,
    # more usefully, means the page does not care which host port the API
    # happens to be published on.
    #
    # The trailing slash on proxy_pass strips the /api prefix, so a request for
    # /api/reports/top-products reaches the API as /reports/top-products.
    location /api/ {
        proxy_pass http://central-api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
